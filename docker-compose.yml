name: pingwatch

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pingwatch
      # Local development default only. Production must set its own password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingwatch_dev}
      POSTGRES_DB: pingwatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingwatch -d pingwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

volumes:
  pgdata:
